name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          git add -f gradle-build.log
          git commit -m "ci: capture build error log"
          git push -f origin build-log

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Pulse.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Debug-APK
          path: release-output/Pulse.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Pulse — Latest Build"
          body: |
            ### 🎵 Pulse Android APK Build

            This build was automatically generated by GitHub Actions.

            - **File**: `Pulse.apk`
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`

            #### Quick Install Instructions:
            1. Download `Pulse.apk` on your Android device.
            2. Open the file and tap **Install** (allow *Install unknown apps* if prompted).
            3. Grant audio permission on first launch and enjoy ad-free offline music!
          draft: false
          prerelease: false
          files: |
            release-output/Pulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
