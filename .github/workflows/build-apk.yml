name: Build and Release Pulse for Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Give every run its own concurrency group so a newer push never kills
# a build that is already running or waiting for a runner.
concurrency:
  group: pulse-android-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Prepare optional stable APK signing key
        shell: bash
        env:
          PULSE_KEYSTORE_BASE64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${PULSE_KEYSTORE_BASE64}" ]]; then
            echo "${PULSE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/pulse-distribution.jks"
            echo "PULSE_KEYSTORE_PATH=${RUNNER_TEMP}/pulse-distribution.jks" >> "${GITHUB_ENV}"
          else
            echo "No stable signing keystore configured; this build will use the runner's temporary Android debug key."
          fi

      - name: Run unit tests and build a clean debug APK
        shell: bash
        env:
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain clean testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK_FILE" ]]; then
            echo "::error::Gradle completed without creating the expected debug APK."
            echo "APK files found under app/build/outputs:"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p release-output
          cp "$APK_FILE" release-output/Pulse.apk
          test -s release-output/Pulse.apk
          unzip -tq release-output/Pulse.apk
          sha256sum release-output/Pulse.apk
          ls -lh release-output/Pulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-APK-${{ github.run_number }}
          path: release-output/Pulse.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log when the build fails
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Build-Log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Check whether this run may update the latest release
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            current_main="$(git ls-remote origin refs/heads/main 2>/dev/null | awk 'NR == 1 {print $1}' || true)"
            if [[ -n "${current_main}" && "${current_main}" == "${GITHUB_SHA}" ]]; then
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            else
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "Skipping latest release because a newer commit is on main."
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish latest or versioned GitHub Release
        if: success() && steps.release_gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Pulse {0}', github.ref_name) || 'Pulse — Latest Build' }}
          body: |
            Pulse Android APK build.

            - File: `Pulse.apk`
            - Branch or tag: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`

            Install the APK on an Android device and allow installation from the file manager or browser if prompted.
          draft: false
          prerelease: false
          overwrite_files: true
          files: release-output/Pulse.apk
