name: Build and Release Pulse for Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests and build a clean debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain clean testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK_FILE" ]]; then
            echo "::error::Gradle completed without creating the expected debug APK."
            echo "APK files found under app/build/outputs:"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p release-output
          cp "$APK_FILE" release-output/Pulse.apk
          test -s release-output/Pulse.apk
          unzip -tq release-output/Pulse.apk
          sha256sum release-output/Pulse.apk
          ls -lh release-output/Pulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-APK-${{ github.run_number }}
          path: release-output/Pulse.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log when the build fails
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Build-Log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish latest or versioned GitHub Release
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Pulse {0}', github.ref_name) || 'Pulse — Latest Build' }}
          body: |
            Pulse Android APK build.

            - File: `Pulse.apk`
            - Branch or tag: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`

            Install the APK on an Android device and allow installation from the file manager or browser if prompted.
          draft: false
          prerelease: false
          overwrite_files: true
          files: release-output/Pulse.apk
