    steps:
      - name: Checkout original commit
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test this exact commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "## Original cancelled run #${{ matrix.run_number }}"
            echo
            echo "- Commit: ${{ matrix.sha }}"
            echo "- Build result: ${{ steps.build.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log for failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log-${{ matrix.run_number }}-${{ matrix.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
