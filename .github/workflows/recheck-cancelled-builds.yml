name: Recheck cancelled Pulse builds

on:
  push:
    branches:
      - ci/recheck-cancelled-2026-11-09

permissions:
  contents: read

concurrency:
  group: pulse-historical-recheck-${{ github.run_id }}
  cancel-in-progress: false

